<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Secret2s | Two-code private session</title>
	<style>
		:root { --ink:#172321; --muted:#687774; --paper:#f4f1e9; --mint:#b8e2cf; --deep:#2e7460; --line:#d9dfd6; --coral:#dc755e; }
		* { box-sizing:border-box; } body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 80% 15%,#d6efe2 0 14%,transparent 35%),linear-gradient(135deg,#f8f6f0,#e9f0e9); font-family:Georgia,'Times New Roman',serif; } main { width:min(850px,calc(100% - 32px)); margin:auto; padding:30px 0 50px; } nav { display:flex; justify-content:space-between; font:12px Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; } nav a { color:var(--deep); text-decoration:none; } .hero { padding:100px 0 45px; max-width:650px; } .eyebrow { color:var(--coral); font:700 12px Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase; } h1 { font-size:clamp(48px,8vw,82px); line-height:.92; font-weight:400; letter-spacing:-.05em; margin:18px 0; } .hero p { color:var(--muted); font-size:19px; line-height:1.45; } .panel { background:rgba(255,253,248,.88); border:1px solid var(--line); padding:30px; box-shadow:0 16px 40px rgba(33,55,46,.07); } .panel h2 { font-size:28px; font-weight:400; margin:0 0 8px; } .panel p { color:var(--muted); font:14px/1.5 Arial,sans-serif; margin:0 0 24px; } .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:block; color:var(--muted); font:700 11px Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; } input { width:100%; padding:15px; border:1px solid var(--line); background:#fff; color:var(--ink); font:18px Arial,sans-serif; letter-spacing:.12em; text-transform:uppercase; outline:none; } input:focus { border-color:var(--deep); box-shadow:0 0 0 3px rgba(46,116,96,.13); } button { border:0; background:var(--ink); color:#fffdf8; cursor:pointer; font:700 12px Arial,sans-serif; letter-spacing:.1em; padding:16px 20px; text-transform:uppercase; } button:hover { background:var(--deep); } .wide { width:100%; margin-top:18px; } .my-code { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; padding:16px 18px; background:var(--mint); } .my-code strong { font:700 28px Arial,sans-serif; letter-spacing:.18em; } .my-code span { color:#376456; font:12px Arial,sans-serif; } .message { min-height:20px; color:var(--coral); font:13px Arial,sans-serif; margin-top:12px; } @media(max-width:620px) { main { width:min(100% - 24px,520px); } .hero { padding:70px 0 35px; } .fields { grid-template-columns:1fr; } .my-code { align-items:flex-start; flex-direction:column; gap:8px; } }
	</style>
</head>
<body>
	<main><nav><a href="index.html">&#8592; Veil</a><span>Secret2s</span></nav><section class="hero"><span class="eyebrow">Two keys. One moment.</span><h1>Private, together.</h1><p>Generate your code, exchange it with a friend, and enter both codes to unlock a ten-minute room.</p></section><form class="panel" id="private-form"><h2>Unlock a session</h2><p>Both people use the same two codes. Your code is yours to share; your friend's code goes in the second box.</p><div class="my-code"><div><span>Your code</span><strong id="my-code"></strong></div><button type="button" id="new-code">Generate new</button></div><div class="fields"><div><label for="your-code">Your code</label><input id="your-code" maxlength="6" required></div><div><label for="friend-code">Friend's code</label><input id="friend-code" maxlength="6" required placeholder="Enter their code"></div></div><button class="wide" type="submit">Try</button><div class="message" id="message" role="alert"></div></form></main>
	<script>
		const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const yourCode = document.querySelector('#your-code'); const myCode = document.querySelector('#my-code'); const friendCode = document.querySelector('#friend-code'); const message = document.querySelector('#message');
		function generateCode() { return Array.from({length:6}, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join(''); } function setOwnCode() { const code = generateCode(); myCode.textContent = code; yourCode.value = code; } setOwnCode(); document.querySelector('#new-code').addEventListener('click', setOwnCode);
		document.querySelector('#private-form').addEventListener('submit', event => { event.preventDefault(); const own = yourCode.value.trim().toUpperCase(); const friend = friendCode.value.trim().toUpperCase(); if (own.length !== 6 || friend.length !== 6 || own === friend) { message.textContent = 'Enter two different six-character codes.'; return; } const pair = [own,friend].sort().join('-'); window.location.href = 'privatechat.html?room=' + encodeURIComponent(pair); });
	</script>
</body>
</html>
