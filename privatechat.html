<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Secret2s | Private room</title>
	<style>
		:root { --ink:#172321; --muted:#71807b; --paper:#f4f1e9; --mint:#b8e2cf; --deep:#2e7460; --line:#d9dfd6; --coral:#dc755e; }
		* { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 12% 15%,#d6efe2 0 12%,transparent 31%),linear-gradient(135deg,#f8f6f0,#e8f0ea); color:var(--ink); font-family:Arial,sans-serif; } .shell { width:min(980px,calc(100% - 28px)); margin:auto; padding:26px 0; } header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:18px; } .brand { font:bold 18px Georgia,serif; letter-spacing:.08em; } .room { color:var(--muted); font-size:12px; letter-spacing:.1em; text-transform:uppercase; } .timer { color:var(--coral); font-weight:bold; font-variant-numeric:tabular-nums; } .chat { height:calc(100vh - 145px); min-height:460px; margin-top:22px; background:rgba(255,253,248,.86); border:1px solid var(--line); display:flex; flex-direction:column; } .messages { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; } .empty { margin:auto; color:var(--muted); text-align:center; font:15px Georgia,serif; } .bubble { max-width:min(72%,580px); padding:12px 15px; line-height:1.45; background:#e6eee8; align-self:flex-start; overflow-wrap:anywhere; } .bubble.mine { background:var(--mint); align-self:flex-end; } .bubble img { display:block; max-width:100%; max-height:280px; margin-top:8px; } .bubble audio { display:block; max-width:100%; margin-top:8px; } .time { display:block; color:var(--muted); font-size:10px; margin-top:7px; } form { display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); align-items:flex-end; } textarea { flex:1; resize:none; min-height:48px; max-height:120px; padding:14px; border:1px solid var(--line); font:15px Arial,sans-serif; outline:none; } textarea:focus { border-color:var(--deep); } button,.file-button { border:0; background:var(--ink); color:#fff; min-height:48px; padding:0 16px; font-weight:bold; letter-spacing:.07em; text-transform:uppercase; cursor:pointer; } button:hover,.file-button:hover { background:var(--deep); } .file-button { display:grid; place-items:center; font-size:18px; padding:0 14px; } input[type=file] { display:none; } .recording { background:var(--coral); } .expired { display:none; position:fixed; inset:0; background:var(--paper); place-items:center; text-align:center; padding:24px; } .expired h1 { font:400 48px Georgia,serif; margin:0 0 10px; } .expired p { color:var(--muted); margin:0 0 22px; } @media(max-width:600px) { .shell { width:calc(100% - 16px); padding-top:16px; } .chat { height:calc(100vh - 115px); min-height:400px; } .messages { padding:16px 10px; } .bubble { max-width:88%; } form { gap:6px; padding:9px; } button,.file-button { padding:0 11px; } }
	</style>
</head>
<body>
	<div class="shell" id="app"><header><span class="brand">SECRET2S</span><span class="room">Private room · <span class="timer" id="timer">10:00</span></span></header><section class="chat"><div class="messages" id="messages"><div class="empty">Unlocking private room...</div></div><form id="message-form"><label class="file-button" title="Send image">+</label><input id="media" type="file" accept="image/*,audio/*"><textarea id="message" maxlength="1000" placeholder="Write a message..." aria-label="Message"></textarea><button type="button" id="voice" title="Record voice">&#9679;</button><button type="submit">Send</button></form></section></div><div class="expired" id="expired"><div><h1>Session ended.</h1><p>The room, messages, images, and voice notes have been deleted.</p><button id="return-home">Return to Secret2s</button></div></div>
	<script type="module">
		import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
		import { getDatabase, ref, onValue, push, set, remove } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js';
		import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js';
		const firebaseApp = initializeApp({apiKey:'AIzaSyCX9UMgWJ0z4yHSJlukPL34MhpTJgpHnDM',authDomain:'encryption-432ea.firebaseapp.com',projectId:'encryption-432ea',storageBucket:'encryption-432ea.firebasestorage.app',messagingSenderId:'966115034669',appId:'1:966115034669:web:a495556c1076eceb4fdaa4',databaseURL:'https://encryption-432ea-default-rtdb.firebaseio.com'});
		const database = getDatabase(firebaseApp); const storage = getStorage(firebaseApp); const roomId = new URLSearchParams(location.search).get('room'); const roomRef = ref(database,'privateRooms/' + roomId); const messages = document.querySelector('#messages'); const messageInput = document.querySelector('#message'); const mediaInput = document.querySelector('#media'); const timer = document.querySelector('#timer'); const app = document.querySelector('#app'); const expired = document.querySelector('#expired'); const visitorId = sessionStorage.getItem('secret2s-visitor') || crypto.randomUUID(); sessionStorage.setItem('secret2s-visitor',visitorId); let room; let stopListening; let recorder; let voiceChunks = [];
		function render() { messages.innerHTML=''; const items=Object.entries(room.messages || {}).sort((a,b)=>a[1].sentAt-b[1].sentAt); if(!items.length){messages.innerHTML='<div class="empty">This room is unlocked. Only the two code holders can see it.</div>';return;} items.forEach(([,item])=>{const bubble=document.createElement('div'); bubble.className='bubble'+(item.sender===visitorId?' mine':''); if(item.text) bubble.append(document.createTextNode(item.text)); if(item.type==='image'){const image=document.createElement('img'); image.src=item.url; image.alt='Shared image'; bubble.append(image);} if(item.type==='audio'){const audio=document.createElement('audio'); audio.controls=true; audio.src=item.url; bubble.append(audio);} const time=document.createElement('span'); time.className='time'; time.textContent=new Date(item.sentAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); bubble.append(time); messages.append(bubble);}); messages.scrollTop=messages.scrollHeight; }
		window.logout=async()=>{if(stopListening)stopListening(); if(room?.messages)await Promise.all(Object.values(room.messages).filter(item=>item.storagePath).map(item=>deleteObject(storageRef(storage,item.storagePath)).catch(()=>{}))); await remove(roomRef).catch(()=>{}); app.style.display='none'; expired.style.display='grid';};
		function tick(){if(!room)return; const left=room.expiresAt-Date.now(); if(left<=0){window.logout();return;} const seconds=Math.ceil(left/1000); timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
		async function ensureRoom(){const initial=await new Promise(resolve=>onValue(roomRef,resolve,{onlyOnce:true})); room=initial.val(); if(!room){const now=Date.now(); room={createdAt:now,expiresAt:now+10*60*1000,messages:{}}; await set(roomRef,room);} if(room.expiresAt<=Date.now()){await window.logout();return;} render(); tick(); stopListening=onValue(roomRef,snapshot=>{room=snapshot.val();if(!room||room.expiresAt<=Date.now())window.logout();else{render();tick();}});}
		ensureRoom(); setInterval(tick,1000);
		document.querySelector('#message-form').addEventListener('submit',async event=>{event.preventDefault();const text=messageInput.value.trim();if(!text||!room||room.expiresAt<=Date.now())return;await push(ref(database,'privateRooms/'+roomId+'/messages'),{text,sender:visitorId,sentAt:Date.now(),type:'text'});messageInput.value='';});
		document.querySelector('.file-button').addEventListener('click',()=>mediaInput.click()); mediaInput.addEventListener('change',async()=>{const file=mediaInput.files[0];if(!file||!room||room.expiresAt<=Date.now())return;const type=file.type.startsWith('image/')?'image':file.type.startsWith('audio/')?'audio':'';if(!type)return;const path='privateMedia/'+roomId+'/'+crypto.randomUUID();const fileRef=storageRef(storage,path);await uploadBytes(fileRef,file);const url=await getDownloadURL(fileRef);await push(ref(database,'privateRooms/'+roomId+'/messages'),{sender:visitorId,sentAt:Date.now(),type,url,storagePath:path});mediaInput.value='';});
		document.querySelector('#voice').addEventListener('click',async event=>{if(recorder?.state==='recording'){recorder.stop();event.currentTarget.classList.remove('recording');event.currentTarget.textContent='&#9679;';return;}const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);voiceChunks=[];recorder.ondataavailable=eventData=>voiceChunks.push(eventData.data);recorder.onstop=async()=>{stream.getTracks().forEach(track=>track.stop());const blob=new Blob(voiceChunks,{type:'audio/webm'});if(!room||room.expiresAt<=Date.now())return;const path='privateMedia/'+roomId+'/'+crypto.randomUUID();const fileRef=storageRef(storage,path);await uploadBytes(fileRef,blob);const url=await getDownloadURL(fileRef);await push(ref(database,'privateRooms/'+roomId+'/messages'),{sender:visitorId,sentAt:Date.now(),type:'audio',url,storagePath:path});};recorder.start();event.currentTarget.classList.add('recording');event.currentTarget.textContent='Stop';});
		messageInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.querySelector('#message-form').requestSubmit();}}); document.querySelector('#return-home').addEventListener('click',()=>location.href='private.html');
	</script>
</body>
</html>
